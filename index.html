<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A dashboard for Utilities 313, a shared living space utilities tracking project."
    />
    <meta name="author" content="Bryan C. Johns" />
    <title>Utilities 313</title>
    <link rel="icon" href="static/images/favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="static/css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/noUiSlider/15.7.1/nouislider.min.css"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/noUiSlider/15.7.1/nouislider.min.js"></script>
    <script src="https://cdn.plot.ly/plotly-2.26.2.min.js"></script>
    <script src="https://d3js.org/d3.v6.min.js"></script>
  </head>
  <body id="index-page">

    <!-- Fixed controls navbar -->
    <nav class="navbar navbar-expand-lg fixed-top custom-navbar">
      <div class="nav-inner">
        <div class="nav-controls-group">
          <label class="switch">
            <input type="checkbox" id="toggle-per-person" />
            <span class="slider"></span>
          </label>
          <span class="toggle-label">Per Person</span>
        </div>
        <div class="nav-date-range">
          <span id="start-date-display" class="date-display"></span>
          <div id="date-slider"></div>
          <span id="end-date-display" class="date-display"></span>
        </div>
      </div>
    </nav>

    <!-- Page header -->
    <header class="page-header">
      <div class="header-content">
        <div class="header-title-group">
          <h1 class="page-title">Utilities 313</h1>
          <p class="page-subtitle">Shared living space &middot; utility expense tracking</p>
        </div>
        <a href="utilities_313_EDA.html" class="eda-link">
          Exploratory Data Analysis &rarr;
        </a>
      </div>
    </header>

    <!-- Main dashboard -->
    <main class="dashboard-content">

      <!-- KPI summary (populated by JS) -->
      <section id="summary-box"></section>

      <!-- Interactive charts -->
      <div id="line-chart-container">
        <div id="line-chart"></div>
        <div id="toggle-container">
          <label class="switch">
            <input type="checkbox" id="toggle-category" />
            <span class="slider"></span>
          </label>
          <span class="toggle-label">Split by Utility Type</span>
        </div>
      </div>

      <div id="treemap-chart" class="plot"></div>
      <div id="stacked-bar-chart" class="plot"></div>
      <div id="category-summary-table" class="plot"></div>

      <!-- Trends & Statistics section -->
      <div class="chart-section-heading">Trends &amp; Statistics</div>

      <div id="table" class="plot"></div>
      <div id="years-line" class="plot"></div>
      <div id="monthly-average-stacked-bar" class="plot"></div>
      <div id="first-last-24-months-chart" class="plot"></div>

    </main>

    <!-- Footer -->
    <footer class="site-footer" role="contentinfo">
      <span class="footer-tagline">Fluent in Data. Fluent in Human.</span>
      <span class="footer-owner">
        &copy; <span id="copyright-year">2025</span>
        <span class="footer-author">Bryan C. Johns</span>
      </span>
      <span class="footer-links">
        <a
          href="https://informedwanderer.com"
          target="_blank"
          class="portfolio-link"
          aria-label="Portfolio"
        >
          <i class="fas fa-laptop-code footer-icon" aria-hidden="true" title="Portfolio"></i>Portfolio
        </a>
        <a
          href="https://www.linkedin.com/in/b-johns/"
          target="_blank"
          class="linkedin-link"
          aria-label="LinkedIn"
        >
          <i class="fab fa-linkedin footer-icon" aria-hidden="true" title="LinkedIn"></i>LinkedIn
        </a>
        <a
          href="https://github.com/johbry17/utilities-313"
          target="_blank"
          class="github-link"
          aria-label="GitHub"
        >
          <i class="fab fa-github footer-icon" aria-hidden="true" title="GitHub"></i>GitHub
        </a>
      </span>
    </footer>

    <script>
      const yearElement = document.getElementById("copyright-year");
      if (yearElement) yearElement.textContent = new Date().getFullYear();
    </script>

    <script src="static/js/plots.js"></script>
    <script src="static/js/app.js"></script>
  </body>
</html>
